<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shipping address frame</title><link rel="stylesheet" href="style.css"></head><body style="background:white;padding:20px"><h3>Shipping address · embedded frame</h3><form id="address"><div class="row"><label>City<input id="city" required data-testid="frame-city"></label><label>Postal code<input id="postal" required data-testid="frame-postal"></label></div><button class="primary">Save address</button></form><p id="saved" role="status"></p><iframe src="nested.html" title="Delivery preferences" id="delivery-frame" style="height:180px"></iframe><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#saved').textContent='Address saved: '+document.querySelector('#city').value+' / '+document.querySelector('#postal').value;parent.postMessage({type:'flowlab-address',city:document.querySelector('#city').value},location.origin)}</script></body></html>
